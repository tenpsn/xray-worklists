services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "4000:4000"
      - "7001:7001" # MPPS - ต้องตรงกับ mppsPort ที่ตั้งไว้ในหน้า Settings (ค่า default 7001)
    volumes:
      - ./backend:/app
      - /app/node_modules
    mem_limit: 300m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    mem_limit: 400m
    restart: unless-stopped
    depends_on:
      - backend
