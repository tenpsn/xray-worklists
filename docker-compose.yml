services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "4000:4000"
      - "4242:4242"
      - "7000:7000"
      - "7001:7001" # MPPS - ต้องตรงกับ mppsPort ที่ตั้งไว้ในหน้า Settings (ค่า default 7001)
    volumes:
      - ./backend:/app
      - /app/node_modules
      # mount ไดรฟ์ host เข้ามาให้ folder picker ในหน้า Settings เห็นและเลือกได้
      # (ต้อง restart container ทุกครั้งที่ต้องการให้เห็นไดรฟ์ใหม่ เช่น USB ที่เสียบทีหลัง)
      - type: bind
        source: C:\
        target: /mnt/hostC
      - type: bind
        source: D:\
        target: /mnt/hostD
    mem_limit: 500m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    mem_limit: 400m
    restart: unless-stopped
    depends_on:
      - backend
